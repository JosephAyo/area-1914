services:
  backend:
    build: ./backend
    container_name: area1914-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL to use the mounted volume path
      DATABASE_URL: "sqlite:////app/data/area1914.db"
    volumes:
      - db-data:/app/data
    expose:
      - "8000"
    networks:
      - shared-proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  db-data:
    driver: local

networks:
  shared-proxy:
    external: true
    name: shared-proxy
